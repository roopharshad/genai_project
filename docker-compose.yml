services:
  docrestore:
    build: .
    image: docrestore-ai
    ports:
      - "80:8000"
    env_file: .env
    volumes:
      - docrestore-data:/app/webapp/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  docrestore-data:
